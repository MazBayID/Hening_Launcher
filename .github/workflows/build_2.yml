name: Build Android

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' # Memicu rilis otomatis saat kamu push tag berawalan 'v' (misal: v0.3)
  pull_request:
    branches: [ "main" ]

# PENTING: Izin ini wajib ada agar GitHub Actions boleh mengunggah file ke halaman Releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Berikan akses eksekusi untuk gradlew
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug

    - name: Ubah Nama APK
      # Memindahkan dan mengganti nama APK asli menjadi Hening-debug.apk agar rapi
      run: mv app/build/outputs/apk/debug/app-debug.apk Hening-debug.apk

    - name: Upload APK ke tab Actions (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: Hening-debug-apk
        path: Hening-debug.apk

    - name: Publikasikan APK ke tab Releases
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: Hening-debug.apk
        generate_release_notes: true
        
