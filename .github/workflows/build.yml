name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk Hening-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Hening-debug-v0.2-apk
          path: Hening-debug-v0.2.apk
      - name: Publikasikan ke Releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" Hening-debug-v0.2.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" Hening-debug-v0.2.apk --title "$GITHUB_REF_NAME" --generate-notes
          fi
