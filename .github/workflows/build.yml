name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk Hening-debug.apk
      - name: Upload APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hening-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publikasikan ke Releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK_PATH" --title "$GITHUB_REF_NAME" --generate-notes
          fi

      - name: Upload APK ke tab Actions (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Hening-debug-apk
          path: Hening-debug.apk

      - name: Publikasikan APK ke tab Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Hening-debug.apk
          generate_release_notes: true
          
